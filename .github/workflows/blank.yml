name: Publish create-nodality-react

# Publishes to npm when a v*.*.* tag is pushed (or by hand).
#
# Trusted publishing, the same as nodality's own release: npm trusts this
# workflow through GitHub's OIDC token (`id-token: write`), so no npm token is
# stored here. The NPM_TOKEN secret this used before stopped working — the
# 1.0.88 publish was refused with E404 on the PUT. Requires the package's
# Trusted Publisher on npmjs.com to name nodalityjs/create-nodality-react and
# this file, blank.yml.
#
# Node 22 and npm >= 11.5.1: trusted publishing needs npm 11.5.1+, and
# Node 18's npm 10.5 fails with provenance.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          FILE_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$FILE_VERSION" ]; then
            echo "Version mismatch: tag=$VERSION, package.json=$FILE_VERSION"
            exit 1
          fi

      - name: Update npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Publish to NPM
        run: npm publish --access public --provenance
